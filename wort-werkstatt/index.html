<style>

.foot{margin-top:16px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-size:13px}

function W(w,s,e,t,pl){return {w:w,s:s.split('-'),e:e,t:t,pl:pl||w};}
const WORDS=[
 W('Kuh','Kuh','🐄',1),W('Hut','Hut','🎩',1),W('Bett','Bett','🛏️',1),W('Brot','Brot','🍞',1),W('Pilz','Pilz','🍄',1),

 W('Mond','Mond','🌙',1),W('Wolf','Wolf','🐺',1),W('Gold','Gold','🪙',1),
 W('Apfel','Ap-fel','🍎',2,'Äpfel'),W('Fisch','Fisch','🐟',2),W('Schaf','Schaf','🐑',2),W('Huhn','Huhn','🐔',2),W('Stein','Stein','🪨',2,'Steine'),
 W('Feuer','Feu-er','🔥',2),W('Wolle','Wol-le','🧶',2),W('Leiter','Lei-ter','🪜',2,'Leitern'),W('Kerze','Ker-ze','🕯️',2,'Kerzen'),
 W('Möhre','Möh-re','🥕',2,'Möhren'),W('Pferd','Pferd','🐴',2),W('Boot','Boot','⛵',2),W('Mauer','Mau-er','🧱',2),W('Eimer','Ei-mer','🪣',2),
 W('Blume','Blu-me','🌸',2),W('Kuchen','Ku-chen','🎂',2),W('Weizen','Wei-zen','🌾',2),W('Fuchs','Fuchs','🦊',2),W('Biene','Bie-ne','🐝',2),W('Dino','Di-no','🦖',2),
 W('Schwein','Schwein','🐷',3),W('Schwert','Schwert','🗡️',3),W('Diamant','Dia-mant','💎',3),W('Schlüssel','Schlüs-sel','🔑',3),
 W('Kompass','Kom-pass','🧭',3),W('Hammer','Ham-mer','🔨',3),W('Kartoffel','Kar-tof-fel','🥔',3),W('Melone','Me-lo-ne','🍉',3),
 W('Brücke','Brü-cke','🌉',3),W('Angel','An-gel','🎣',3),W('Fenster','Fens-ter','🪟',3),W('Spinne','Spin-ne','🕷️',3),
 W('Rakete','Ra-ke-te','🚀',3),W('Kürbis','Kür-bis','🎃',3),W('Schild','Schild','🛡️',3),
 W('Spitzhacke','Spitz-ha-cke','⛏️',4),W('Holztür','Holz-tür','🪵🚪',4),W('Steinhaus','Stein-haus','🪨🏠',4),W('Apfelbaum','Ap-fel-baum','🍎🌳',4),
 W('Pilzsuppe','Pilz-sup-pe','🍄🍲',4),W('Schmetterling','Schmet-ter-ling','🦋',4),W('Erdbeere','Erd-bee-re','🍓',4),
 W('Hubschrauber','Hub-schrau-ber','🚁',4),W('Dinosaurier','Di-no-sau-ri-er','🦕',4),W('Feuerwerk','Feu-er-werk','🎆',4),
 W('Regenbogen','Re-gen-bo-gen','🌈',4),W('Schneemann','Schnee-mann','⛄',4)

const RARE=[{id:'burg',e:'🏰',n:'Burg'},{id:'drache',e:'🐉',n:'Drache'},{id:'regenbogen',e:'🌈',n:'Regenbogen'},{id:'einhorn',e:'🦄',n:'Einhorn'},{id:'rakete',e:'🚀',n:'Rakete'},{id:'krone',e:'👑',n:'Krone'}];
const RECIPES=[
 {r:'Boot',acc:'ein Boot',ing:{Holz:5}},{r:'Leiter',acc:'eine Leiter',ing:{Holz:3}},{r:'Tür',acc:'eine Tür',ing:{Holz:4}},
 {r:'Bett',acc:'ein Bett',ing:{Wolle:3,Holz:3}},{r:'Axt',acc:'eine Axt',ing:{Holz:2,Stein:3}},{r:'Brot',acc:'ein Brot',ing:{Weizen:3}},
 {r:'Kuchen',acc:'einen Kuchen',ing:{Weizen:3,Apfel:2}},{r:'Eimer',acc:'einen Eimer',ing:{Stein:3}},{r:'Mauer',acc:'eine Mauer',ing:{Stein:6}},
 {r:'Haus',acc:'ein Haus',ing:{Holz:5,Stein:4}},{r:'Brücke',acc:'eine Brücke',ing:{Holz:4,Stein:3}},{r:'Schwert',acc:'ein Schwert',ing:{Holz:1,Stein:2}},
 {r:'Kerze',acc:'eine Kerze',ing:{Wolle:1,Feuer:1}},
 {r:'Haus',acc:'ein Haus',ing:{Holz:5,Stein:4,Tür:1}},{r:'Boot',acc:'ein Boot',ing:{Holz:5,Wolle:2,Eimer:1}},
 {r:'Kuchen',acc:'einen Kuchen',ing:{Weizen:3,Apfel:2,Möhre:1}},{r:'Bett',acc:'ein Bett',ing:{Wolle:3,Holz:3,Kerze:1}},
 {r:'Brücke',acc:'eine Brücke',ing:{Holz:4,Stein:3,Leiter:1}},{r:'Schwert',acc:'ein Schwert',ing:{Holz:1,Stein:2,Gold:1}},
 {r:'Spitzhacke',acc:'eine Spitzhacke',ing:{Holz:2,Stein:3,Gold:1}}
];
const BASE=['Holz','Stein','Wolle','Weizen','Apfel','Möhre','Eimer','Leiter','Tür','Feuer','Kerze','Gold'];
const SENT={
 2:['Ich sehe ein Schaf.','Die Kuh ist groß.','Der Fisch schwimmt.','Das Haus ist rot.','Ich esse einen Apfel.','Wir bauen ein Boot.','Die Blume ist schön.','Das Huhn legt ein Ei.','Ich habe einen Hut.','Der Pilz ist klein.','Mama backt Kuchen.','Der Fuchs ist schnell.'],
 3:['Ich baue ein Haus aus Holz.','Der Fuchs schleicht durch den Wald.','Wir gehen über die Brücke.','Das Schwein liegt im Stroh.','Ich suche einen Schlüssel.','Der Diamant glitzert in der Höhle.','Papa hat einen Hammer.','Die Spinne sitzt im Netz.','Ich pflanze eine Melone.','Die Rakete fliegt zum Mond.'],
 4:['Der Schmetterling fliegt über die Blumenwiese.','Wir bauen ein Steinhaus am Fluss.','Der Dinosaurier ist riesengroß.','Nach dem Regen kommt der Regenbogen.','Ich esse Erdbeeren mit Sahne.','Im Winter bauen wir einen Schneemann.','Der Hubschrauber landet auf dem Dach.','Mit der Spitzhacke grabe ich nach Diamanten.','Zum Geburtstag gibt es ein Feuerwerk.']

const KEYS='abcdefghijklmnopqrstuvwxyzäöüß'.split('');

/* ---------- Helfer ---------- */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[ri(0,a.length-1)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function p2(n){return (n<10?'0':'')+n;}
function todayStr(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n);}

/* ---------- Spielstand ---------- */
function defaults(){return {v:1,inv:{},rare:{},mast:{},world:new Array(48).fill(''),chestProg:0,chests:0,streak:{last:'',days:0},journeys:0,
 stats:{find:{n:0,ok:0},write:{n:0,ok:0},craft:{n:0,ok:0},sentence:{n:0,ok:0}},settings:{syl:true,sound:true,auto:true,unlock:false}};}
function load(){const d=defaults();try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object'){for(const k in d){if(o[k]!==undefined){if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))d[k]=Object.assign(d[k],o[k]);else d[k]=o[k];}}}}}catch(e){}
 if(!Array.isArray(d.world)||d.world.length!==48)d.world=new Array(48).fill('');return d;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
let view='hub',J=null,Tr=null,sel='',eraseMode=false,confirmReset=false,sessionJ=0,lastSentence='';

function mast(w){if(!S.mast[w])S.mast[w]={m:0,ok:0,bad:0};return S.mast[w];}
function tierSize(t){return WORDS.filter(function(x){return x.t===t;}).length;}
function tierMastered(t){return WORDS.filter(function(x){return x.t===t&&S.mast[x.w]&&S.mast[x.w].m>=1;}).length;}
function tierUnlocked(t){return t===1||S.settings.unlock||tierMastered(t-1)>=Math.ceil(tierSize(t-1)*0.5);}
function recTier(){let r=1;for(let t=1;t<=4;t++){if(tierUnlocked(t))r=t;}return r;}
function weight(w){const x=S.mast[w]||{m:0,bad:0};return 1+(3-Math.min(3,x.m))*2+Math.min(x.bad,3);}
function pickWords(tier,n,not){
 const pool=WORDS.filter(function(x){return x.t===tier&&(not||[]).indexOf(x.w)<0;}),res=[];
 while(res.length<n&&pool.length){

 }

}

function emojiOf(key){if(key.indexOf('r:')===0){const r=RARE.filter(function(x){return 'r:'+x.id===key;})[0];return r?r.e:'❓';}const w=BYW[key];return w?w.e:'❓';}
function plural(w,n){return n===1?w:(BYW[w]?BYW[w].pl:w);}

/* ---------- Missionen erzeugen ---------- */
function commonPrefix(a,b){let i=0;a=a.toLowerCase();b=b.toLowerCase();while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i;}
function genFind(tier){
 const nT=tier===1?1:tier===2?2:3,nTiles=tier===1?4:tier===2?6:tier===3?9:12;
 const targets=pickWords(tier,nT);
 const tn=targets.map(function(x){return x.w;});
 const pool=WORDS.filter(function(x){return x.t<=tier&&x.t>=Math.max(1,tier-1)&&tn.indexOf(x.w)<0;});
 let dis=[];
 if(tier>=3){
  const scored=shuffle(pool).sort(function(a,b){return (Math.max.apply(null,tn.map(function(t){return commonPrefix(b.w,t)+(Math.abs(b.w.length-t.length)<2?1:0);}))-Math.max.apply(null,tn.map(function(t){return commonPrefix(a.w,t)+(Math.abs(a.w.length-t.length)<2?1:0);})));});
  dis=scored.slice(0,3);
  dis=dis.concat(shuffle(scored.slice(3)).slice(0,nTiles-nT-dis.length));
 }else dis=shuffle(pool).slice(0,nTiles-nT);

 return {type:'find',tier:tier,targets:tn,tiles:tiles,found:[],mistakes:0,wrongRun:0,help:false,done:false,shakeW:''};
}
function genWrite(tier){
 const wd=pickWords(tier,1)[0],chars=wd.w.split('');
 let tiles=[],kb=false;
 if(tier>=3){kb=true;tiles=KEYS.map(function(c){return {id:'k_'+c,c:c,used:false};});}
 else{
  let cs=chars.map(function(c){return c.toLowerCase();});
  if(tier===2){const letters='abdefghiklmnoprstuw'.split('').filter(function(c){return cs.indexOf(c)<0;});cs=cs.concat(shuffle(letters).slice(0,3));}
  tiles=shuffle(cs.map(function(c,i){return {id:'t'+i,c:c,used:false};}));

 return {type:'write',tier:tier,word:wd.w,chars:chars,pos:0,tiles:tiles,kb:kb,mistakes:0,wrongRun:0,peeks:0,hintChar:'',reveal:false,done:false,shakeId:''};
}
function genSentence(tier){
 const t=Math.max(2,Math.min(4,tier));let s,i=0;
 do{s=pick(SENT[t]);i++;}while(s===lastSentence&&i<10);

 return {type:'sentence',tier:tier,sentence:s,tokens:tokens,pos:0,tiles:shuffle(tokens.map(function(x,k){return {id:'s'+k,c:x,used:false};})),mistakes:0,wrongRun:0,hintTok:'',done:false,shakeId:''};
}
function genCraft(tier){
 const cand=RECIPES.filter(function(r){const n=Object.keys(r.ing).length;return tier<=3?n<=2&&BYW[r.r].t<=3:n===3;});

function missionTypes(tier){
 if(tier===1)return ['find','write','find'];
 if(tier===2)return shuffle(['find','write','sentence']);

/* ---------- Texte ---------- */
function listText(ing,order,useHtml){
 const parts=order.map(function(w){const n=ing[w];const nm=plural(w,n);return n+' '+(useHtml&&n===1?wordHTML(w):useHtml?'<span class="wd" data-act="say" data-w="'+nm+'">'+nm+'</span>':nm);});
 if(parts.length===1)return parts[0];
 return parts.slice(0,-1).join(', ')+' und '+parts[parts.length-1];
}
function questText(m,html){
 const w=function(x){return html?wordHTML(x):x;};
 if(m.type==='find'){
  if(m.tier===1)return 'Finde: '+w(m.targets[0])+'!';
  if(m.tier===2)return 'Bring mir: '+w(m.targets[0])+' und '+w(m.targets[1])+'.';
  return 'Hol mir: '+w(m.targets[0])+', '+w(m.targets[1])+' und '+w(m.targets[2])+'.';
 }
 if(m.type==='craft')return 'Baue '+m.acc+'. Du brauchst '+listText(m.ing,m.order,html)+'.';
 if(m.type==='write')return 'Schreibe das Wort: '+m.word;
 return m.sentence;
}

/* ---------- Engine ---------- */
function tapFind(m,w){
 if(m.done)return null;
 if(m.targets.indexOf(w)>=0&&m.found.indexOf(w)<0){
  m.found.push(w);m.wrongRun=0;grant(w,ri(1,3));addPts(1);
  if(m.found.length===m.targets.length)m.done=true;
  return 'ok';
 }
 if(m.found.indexOf(w)>=0)return null;
 m.mistakes++;m.wrongRun++;m.shakeW=w;
 if(m.wrongRun>=2)m.help=true;
 return 'wrong';
}
function tapWrite(m,id){
 if(m.done)return null;
 const t=m.tiles.filter(function(x){return x.id===id;})[0];
 if(!t||(t.used&&!m.kb))return null;
 const exp=m.chars[m.pos];
 if(t.c.toLowerCase()===exp.toLowerCase()){
  if(!m.kb)t.used=true;
  m.pos++;m.wrongRun=0;m.hintChar='';
  if(m.pos>=m.chars.length)m.done=true;
  return 'ok';
 }
 m.mistakes++;m.wrongRun++;m.shakeId=id;
 if(m.wrongRun>=3)m.hintChar=exp.toLowerCase();
 return 'wrong';
}
function tapSentence(m,id){
 if(m.done)return null;
 const t=m.tiles.filter(function(x){return x.id===id;})[0];
 if(!t||t.used)return null;
 if(t.c===m.tokens[m.pos]){
  t.used=true;m.pos++;m.wrongRun=0;m.hintTok='';
  if(m.pos>=m.tokens.length)m.done=true;
  return 'ok';
 }
 m.mistakes++;m.wrongRun++;m.shakeId=id;
 if(m.wrongRun>=3)m.hintTok=m.tokens[m.pos];
 return 'wrong';
}
function craftAdd(m,w){if(m.done)return;m.table[w]=Math.min(9,(m.table[w]||0)+1);m.states=null;}
function craftSub(m,w){if(m.done)return;if(m.table[w]){m.table[w]--;if(m.table[w]<=0)delete m.table[w];}m.states=null;}
function craftCheck(m){
 const st={};let ok=true;
 Object.keys(m.table).concat(m.order).forEach(function(w){
  const need=m.ing[w]||0,have=m.table[w]||0;
  st[w]=have===need?'ok':have<need?'few':'many';
  if(have!==need)ok=false;
 });
 m.states=st;
 if(ok){m.done=true;return 'ok';}
 m.tries++;return 'wrong';
}

/* ---------- Reise ---------- */
function startJourney(tier){
 const types=missionTypes(tier);
 J={tier:tier,types:types,idx:0,cur:genMission(types[0],tier),items:{},oks:0,perfect:0,settled:false};
 view='mission';
}
function settleMission(){
 const m=J.cur;if(J.settled||!m.done)return;J.settled=true;
 const st=S.stats[m.type];st.n++;st.ok++;J.oks++;
 let perfect=m.mistakes===0;
 if(m.type==='find'){
  m.targets.forEach(function(w){const x=mast(w);if(perfect){x.m=Math.min(3,x.m+1);x.ok++;}else x.bad++;});
 }else if(m.type==='write'){
  const x=mast(m.word);perfect=perfect&&m.peeks===0;
  if(perfect){x.m=Math.min(3,x.m+1);x.ok++;}else x.bad++;
  grant(m.word,ri(2,4));addPts(2);
 }else if(m.type==='craft'){
  perfect=m.tries===0;
  grant(m.result,1+ri(0,1));addPts(2);
 }else{
  perfect=m.mistakes===0;
  m.tokens.forEach(function(tk){const bare=tk.replace(/[.,!?]/g,'');const hit=WORDS.filter(function(x){return x.w===bare||x.pl===bare;})[0];if(hit)grant(hit.w,1);});
  addPts(2);
 }
 if(perfect)J.perfect++;
 save();
}
function nextMission(){
 if(J.idx<J.types.length-1){J.idx++;J.cur=genMission(J.types[J.idx],J.tier);J.settled=false;}
 else finishJourney();
}
function finishJourney(){
 const today=todayStr();J.dayBonus=0;
 if(S.streak.last!==today){S.streak.days=S.streak.last===todayStr(-1)?S.streak.days+1:1;S.streak.last=today;J.dayBonus=3;addPts(3);}
 S.journeys++;sessionJ++;save();view='ergebnis';
}
function chestOpen(){
 if(S.chests<=0)return null;
 S.chests--;
 const maxT=recTier(),pool=WORDS.filter(function(x){return x.t<=maxT;}),items=[];
 shuffle(pool).slice(0,3).forEach(function(x){const n=ri(1,2);S.inv[x.w]=(S.inv[x.w]||0)+n;items.push({k:x.w,n:n});});
 let rare=null;
 if(Math.random()<0.12){rare=pick(RARE);S.rare[rare.id]=(S.rare[rare.id]||0)+1;}
 save();return {items:items,rare:rare};
}
function invCount(key){return key.indexOf('r:')===0?(S.rare[key.slice(2)]||0):(S.inv[key]||0);}
function invAdd(key,n){if(key.indexOf('r:')===0){const id=key.slice(2);S.rare[id]=(S.rare[id]||0)+n;}else S.inv[key]=(S.inv[key]||0)+n;}
function placeCell(i,key){
 if(!key||invCount(key)<=0)return false;
 if(S.world[i])invAdd(S.world[i],1);
 S.world[i]=key;invAdd(key,-1);save();return true;
}
function pickUpCell(i){if(!S.world[i])return false;invAdd(S.world[i],1);S.world[i]='';save();return true;}

/* ---------- Ton ---------- */
let AC=null;
function beep(f,d,type){
 if(!S.settings.sound)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}
}
function sfx(k){if(k==='ok'){beep(660,.12);setTimeout(function(){beep(880,.16);},90);}else if(k==='bad')beep(180,.22,'sawtooth');else if(k==='win'){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,.2);},i*110);});}}
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.85;const vs=speechSynthesis.getVoices().filter(function(v){return /^de/i.test(v.lang);});if(vs.length)u.voice=vs.find(function(v){return /anna|helena|petra|marlene|vicki/i.test(v.name);})||vs[0];speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

 const st=S.stats;h+='<p style="margin-top:8px"><small>Gelöste Aufgaben: Finden '+st.find.ok+' · Schreiben '+st.write.ok+' · Bauen '+st.craft.ok+' · Sätze '+st.sentence.ok+' · Runden '+S.journeys+'</small></p></div>';
 const bad=WORDS.filter(function(x){return S.mast[x.w]&&S.mast[x.w].bad>0;}).sort(function(a,b){return S.mast[b.w].bad-S.mast[a.w].bad;}).slice(0,10);
 h+='<div class="card"><b>Übungswörter (häufig schwierig)</b>'+(bad.length?'<p>'+bad.map(function(x){return x.e+' '+x.w+' ('+S.mast[x.w].bad+')';}).join(' · ')+'</p>':'<p><small>Noch nichts aufgefallen.</small></p>')+'<small>Diese Wörter kommen automatisch häufiger dran.</small></div>';
 h+='<div class="card"><label style="display:flex;gap:10px;align-items:center;font-size:18px"><input type="checkbox" id="optUnlock" data-act="optUnlock" '+(S.settings.unlock?'checked':'')+' style="width:28px;height:28px"> Alle Stufen freischalten</label><label style="display:flex;gap:10px;align-items:center;font-size:18px;margin-top:10px"><input type="checkbox" id="optAuto" data-act="optAuto" '+(S.settings.auto?'checked':'')+' style="width:28px;height:28px"> Aufgaben automatisch vorlesen</label></div>';
 h+='<div class="card">'+(confirmReset?'<p><b>Wirklich alles löschen?</b> Welt, Wörter und Fortschritt sind dann weg.</p><button class="sm" style="background:#ffc6bd" data-act="resetYes">Ja, löschen</button> <button class="sm" data-act="resetNo">Abbrechen</button>':'<button class="sm" data-act="resetAsk">Spielstand zurücksetzen</button>')+'</div>';
 return h;
}
function render(){
 const el=document.getElementById('app');
 el.innerHTML=view==='hub'?hubHTML():view==='mission'?missionHTML():view==='ergebnis'?ergebnisHTML():view==='truhe'?chestHTML():view==='world'?worldHTML():view==='book'?bookHTML():elternHTML();
 if(J&&J.cur){J.cur.shakeW='';J.cur.shakeId='';}
}
function go(v){view=v;confirmReset=false;render();window.scrollTo(0,0);}

/* ---------- Eingaben ---------- */
function afterTap(res,m){
 if(res==='ok')sfx('ok');else if(res==='wrong')sfx('bad');
 if(m.done){settleMission();sfx('win');
  if(m.type==='write')speak(m.word);else if(m.type==='sentence')speak(m.sentence);else if(m.type==='craft')speak(m.result);}
 render();
}
function speakQ(){
 const m=J.cur;
 if(m.type==='write')return speak(m.word);
 if(m.type==='sentence')return speak(m.sentence);
 speak(questText(m,false));
}
function autoSay(){
 if(!S.settings.auto||!J)return;
 const m=J.cur;
 setTimeout(function(){if(view==='mission'&&J&&J.cur===m){if(m.type==='write')speak(m.word);else speakQ();}},350);
}
document.getElementById('app').addEventListener('click',function(e){
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.getAttribute('data-act'),m=J&&J.cur;
 if(a==='say')return speak(b.getAttribute('data-w'));
 if(a==='tileF')return afterTap(tapFind(m,b.getAttribute('data-w')),m);
 if(a==='tileW')return afterTap(tapWrite(m,b.getAttribute('data-id')),m);
 if(a==='tileS')return afterTap(tapSentence(m,b.getAttribute('data-id')),m);
 if(a==='peek'){m.peeks++;m.reveal=true;render();setTimeout(function(){if(J&&J.cur===m){m.reveal=false;if(view==='mission')render();}},2800);return;}
 if(a==='craftAdd'){craftAdd(m,b.getAttribute('data-w'));sfx('ok');return render();}
 if(a==='craftSub'){craftSub(m,b.getAttribute('data-w'));return render();}
 if(a==='craftGo'){return afterTap(craftCheck(m),m);}
 if(a==='speakQ')return speakQ();
 if(a==='next'){nextMission();go(view);if(view==='mission')autoSay();return;}
 if(a==='play'){startJourney(Number(b.getAttribute('data-t')));go('mission');return autoSay();}
 if(a==='again'){startJourney(recTier());go('mission');return autoSay();}
 if(a==='hub')return go('hub');
 if(a==='toChest'){Tr={res:null};return go('truhe');}
 if(a==='openChest'){Tr.res=chestOpen();sfx('win');return render();}
 if(a==='toWorld')return go('world');
 if(a==='toBook')return go('book');
 if(a==='toEltern')return go('eltern');
 if(a==='selItem'){sel=b.getAttribute('data-k');eraseMode=false;return render();}
 if(a==='erase'){eraseMode=!eraseMode;return render();}
 if(a==='cell'){const i=Number(b.getAttribute('data-i'));if(eraseMode||(!sel&&S.world[i]))pickUpCell(i);else if(sel){if(!placeCell(i,sel)){sel='';}else sfx('ok');}return render();}
 if(a==='tglSyl'){S.settings.syl=!S.settings.syl;save();return render();}
 if(a==='tglSound'){S.settings.sound=!S.settings.sound;save();return render();}
 if(a==='resetAsk'){confirmReset=true;return render();}
 if(a==='resetNo'){confirmReset=false;return render();}
 if(a==='resetYes'){S=defaults();save();sessionJ=0;J=null;sel='';return go('hub');}
});
document.getElementById('app').addEventListener('change',function(e){
 const id=e.target&&e.target.id;
 if(id==='optUnlock'){S.settings.unlock=e.target.checked;save();}
 if(id==='optAuto'){S.settings.auto=e.target.checked;save();}
});
render();
</script>
</body>
</html>
